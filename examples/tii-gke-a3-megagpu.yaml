---

blueprint_name: gke-a3-mega-tii

# GCS bucket for persisting the Terraform state
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: tii-poc-gke-a3mega-bucket

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: gke-a3-mega-tii
  region: us-central1
  zone: us-central1-a

  # Cidr block containing the IP of the machine calling terraform.
  # The following line must be updated for this example to work.
  authorized_cidr: <your-ip-address>/32

deployment_groups:
- group: setup
  modules:
  - id: network1
    source: modules/network/vpc
    settings:
      subnetwork_name: gke-subnet-a3-mega-tii
      mtu: 8896
      secondary_ranges:
        gke-subnet-a3-mega-tii:
        - range_name: pods
          ip_cidr_range: 10.4.0.0/14
        - range_name: services
          ip_cidr_range: 10.0.32.0/20

  - id: private_service_access # required for parallelstore
    source: community/modules/network/private-service-access
    use: [network1]
    settings:
      prefix_length: 24


- group: primary
  modules:
  # allow parallelstore connection
  - id: parallelstore_firewall_rule
    source: modules/network/firewall-rules
    use: [network1]
    settings:
      ingress_rules:
      - name: $(vars.deployment_name)-allow-parallelstore-traffic
        description: Allow parallelstore traffic
        source_ranges:
        - $(private_service_access.cidr_range)
        allow:
        - protocol: tcp

  - id: gpunets
    source: modules/network/multivpc
    settings:
      network_name_prefix: $(vars.deployment_name)-gpunet
      global_ip_address_range: 192.169.0.0/16
      network_count: 8
      subnetwork_cidr_suffix: 20
      mtu: 8244

  - id: gke_cluster
    source: modules/scheduler/gke-cluster
    use: [network1, gpunets]
    settings:
      min_master_version: 1.30.4-gke.1348000
      configure_workload_identity_sa: true
      enable_parallelstore_csi: true # enable Parallelstore for the cluster
      enable_private_endpoint: false  # Allows for access from authorized public IPs
      master_authorized_networks:
      - cidr_block: $(vars.authorized_cidr)  # Allows your machine run kubectl command. It's required for the multi-network setup.
        display_name: "kubectl-access-network"
    outputs: [instructions]

  ### Set up storage class and persistent volume claim for Parallelstore ###
  - id: parallelstore-setup
    source: modules/file-system/gke-storage
    use: [gke_cluster, private_service_access]
    settings:
      storage_type: Parallelstore
      access_mode: ReadWriteMany
      sc_volume_binding_mode: Immediate
      sc_reclaim_policy: Retain # Use Retain if you want to volume and parallelstore resource will remain after
      sc_topology_zones: [$(vars.zone)]
      pvc_count: 1
      capacity_gb: 12000 # from 12,000 GiB to 100,000 GiB, in multiples of 4,000 GiB

  - id: default_pool
    source: modules/compute/gke-node-pool
    use: [gke_cluster]
    settings:
      name: default-pool
      machine_type: e2-standard-4
      autoscaling_total_min_nodes: 2
      zones: [$(vars.zone)]
    outputs: [instructions]

  - id: topology_aware_scheduler_install
    source: community/modules/compute/gke-topology-scheduler
    use: [gke_cluster]

  - id: a3_megagpu_pool
    source: modules/compute/gke-node-pool
    use: [gke_cluster, gpunets]
    settings:
      machine_type: a3-megagpu-8g
      static_node_count: 8
      disk_size_gb: 200
      reservation_affinity:
        consume_reservation_type: SPECIFIC_RESERVATION
        specific_reservations:
        - name: a3mega-8
          project: $(vars.project_id)
      zones: [$(vars.zone)]
    outputs: [instructions]

  # Train a TensorFlow model with Keras and Parallelstore on GKE
  - id: parallelstore-job
    source: modules/compute/gke-job-template
    use: [gke_cluster, parallelstore-setup]
    settings:
      name: tensorflow
      image: jupyter/tensorflow-notebook@sha256:173f124f638efe870bb2b535e01a76a80a95217e66ed00751058c51c09d6d85d
      security_context:  # to make sure the job have enough access to execute the jobs and r/w from parallelstore
      - key: runAsUser
        value: 1000
      - key: runAsGroup
        value: 100
      - key: fsGroup
        value: 100
      command:
      - bash
      - -c
      - |
        pip install transformers datasets
        python - <<EOF
        from datasets import load_dataset
        dataset = load_dataset("glue", "cola", cache_dir='/data/parallelstore-pvc-0')
        dataset = dataset["train"]
        from transformers import AutoTokenizer
        import numpy as np
        tokenizer = AutoTokenizer.from_pretrained("bert-base-cased")
        tokenized_data = tokenizer(dataset["sentence"], return_tensors="np", padding=True)
        tokenized_data = dict(tokenized_data)
        labels = np.array(dataset["label"])
        from transformers import TFAutoModelForSequenceClassification
        from tensorflow.keras.optimizers import Adam
        model = TFAutoModelForSequenceClassification.from_pretrained("bert-base-cased")
        model.compile(optimizer=Adam(3e-5))
        model.fit(tokenized_data, labels)
        EOF
      node_count: 1
    outputs: [instructions]
